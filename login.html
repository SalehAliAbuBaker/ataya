<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | سجل العطايا والمستفيدين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
        
        <!-- الترويسة والترحيب -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 text-indigo-600 text-3xl mb-3 shadow-inner">
                📋
            </div>
            <h1 class="text-xl font-bold text-slate-800">سجل العطايا والمستفيدين</h1>
            <p class="text-xs text-slate-500 mt-1">يرجى تسجيل اسمك للدخول وتوثيق العمليات المنفذة</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم / المسؤول *</label>
                <input type="text" id="username" required placeholder="مثال: صالح الخطيب أو أحمد..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور *</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50">
            </div>

            <p id="errorMsg" class="text-xs text-rose-600 hidden font-semibold text-center"></p>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-md transition">
                تسجيل الدخول للنظام
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <span class="text-[11px] text-slate-400">مؤسسة الرأفة للتنمية • نظام إدارة العطايا</span>
        </div>
    </div>

    <script>
        // التحقق المبدئي (يمكنك تخصيص المستخدمين وكلمات المرور لاحقاً)
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const error = document.getElementById('errorMsg');

            if (!user) {
                error.innerText = 'يرجى كتابة الاسم';
                error.classList.remove('hidden');
                return;
            }

            // كلمة مرور مبدئية: 123456 (يمكن تغييرها)
            if (pass !== '123456') {
                error.innerText = 'كلمة المرور غير صحيحة';
                error.classList.remove('hidden');
                return;
            }

            // حفظ بيانات المستخدم الحالي بالجلسة
            sessionStorage.setItem('current_user', user);
            localStorage.setItem('last_active_user', user);

            // الانتقال إلى شاشة النظام الرئيسية
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
